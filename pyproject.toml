[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searxng-ai-overview"
version = "0.1.0"
description = "Streaming, source-linked AI overviews for SearXNG"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1", "itsdangerous>=2.1", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_overview = ["static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN"]
# Preserve the project's explicit typing.Optional convention.
ignore = ["ANN401", "UP045"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.9",
    "playwright>=1.49",
    "ty>=0.0.82",
]
