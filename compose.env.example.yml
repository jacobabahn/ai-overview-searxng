# One model, no overview.yml. Merge into an existing deployment as needed.
# Supply a complete SearXNG settings.yml with the plugin enabled.
services:
  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:2026.9.19-e831fc2a1}
    ports:
      - "127.0.0.1:8888:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_OVERVIEW_BACKEND: ${AI_OVERVIEW_BACKEND:-ollama}
      AI_OVERVIEW_MODEL: ${AI_OVERVIEW_MODEL:?Set AI_OVERVIEW_MODEL to an available model ID}
      # For hosted backends, remove this override to use the provider default.
      AI_OVERVIEW_ENDPOINT: ${AI_OVERVIEW_ENDPOINT:-http://host.docker.internal:11434/api/chat}
      # Use for hosted providers or authenticated local servers.
      AI_OVERVIEW_API_KEY: ${AI_OVERVIEW_API_KEY:-}
    volumes:
      - ./src/ai_overview:/usr/local/searxng/ai_overview:ro
      - ./settings.yml:/etc/searxng/settings.yml:ro
