name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install uv
        run: python -m pip install uv==0.12.15
      - name: Install dependencies
        run: uv sync --locked
      - name: Check
        run: make check
      - name: Build distributions
        run: uv build
