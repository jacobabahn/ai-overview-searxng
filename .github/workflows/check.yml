name: Checks

# Release tags run these jobs through release.yml instead, so tag pushes are
# left out here to avoid running them twice.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install uv
        run: python -m pip install uv==0.12.15
      - name: Install dependencies
        run: uv sync --locked
      - name: Check
        run: make check
      - name: Build distributions
        run: uv build

  # Runs on the GitHub runner itself; nothing is built or deployed. Compose
  # pulls the published SearXNG image pinned in compose.test.yml, mounts the
  # plugin source from this checkout into it, and starts a fake model provider
  # beside it. The checks then drive that instance at 127.0.0.1:8899 with
  # headless Chromium. No real search engines or model providers are called.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv==0.12.15
      - name: Install dependencies
        run: uv sync --locked
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Integration checks
        run: make integration
      - name: Compose logs
        if: failure()
        run: |
          docker compose -f compose.test.yml images
          docker compose -f compose.test.yml logs --no-color
      - name: Tear down
        if: always()
        run: make integration-down
