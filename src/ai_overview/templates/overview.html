<link rel="stylesheet" href="{{ url_for('ai_overview.static', filename='overview.css') }}">
<section class="ai-overview" aria-label="AI Summary" data-expanded="false" data-loading="true" data-token="{{ token }}"
         data-endpoint="{{ url_for('ai_overview.stream') }}"
         data-models-endpoint="{{ url_for('ai_overview.models') }}"
         data-select-endpoint="{{ url_for('ai_overview.select') }}"
         data-profile="{{ profile }}" data-model="{{ model }}">
  <header class="ai-overview-header">
    <h2><span class="ai-sparkle" aria-hidden="true">✦</span>AI Summary</h2>
    <div class="ai-header-actions">
      <div class="ai-generation-action">
        <button type="button" class="ai-stop" aria-label="Stop generating" title="Stop generating" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
        <button type="button" class="ai-copy" aria-label="Copy answer" title="Copy answer" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg></button>
      </div>
      <button type="button" class="ai-options-toggle" aria-label="Overview options" aria-expanded="false" title="Overview options"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button>
      <button type="button" class="ai-collapse" aria-label="Collapse overview" aria-expanded="true" title="Collapse overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
    </div>
  </header>
  <div class="ai-options" hidden>
    {% if model_picker %}
    <button type="button" class="ai-settings-toggle" aria-expanded="false">Model settings</button>
    {% endif %}
    <button type="button" class="ai-regenerate">Regenerate overview</button>
  </div>
  {% if model_picker %}
  <div class="ai-model-settings" hidden>
    <p class="ai-current-model">Current model: {{ model }}</p>
    <label>Model <select class="ai-model" aria-label="Overview model" disabled>
      <option>{{ profile }} / {{ model }}</option>
    </select></label>
    <div class="ai-settings-actions">
      <button type="button" class="ai-apply-model" disabled>Use model and restart</button>
      <button type="button" class="ai-refresh-models">Reload list</button>
    </div>
    <small>Restarts the overview and clears follow-ups.</small>
    <p class="ai-model-status" role="status" aria-live="polite"></p>
  </div>
  {% endif %}
  <p class="ai-collapsed-preview" hidden></p>
  <div class="ai-content">
    <p class="ai-provenance">Based on search snippets</p>
    <p class="ai-status" role="status" aria-live="polite">Reading search results…</p>
    <div class="ai-turns"></div>
    <div class="ai-more-row" hidden><button type="button" class="ai-more" aria-expanded="false"><span>More</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
    <span class="ai-copy-status ai-sr-only" role="status"></span>
    <div class="ai-actions">
      <button type="button" class="ai-retry" hidden>Retry</button>
    </div>
    <form class="ai-follow-up" hidden>
      <label><span class="ai-sr-only">Ask a follow-up</span>
        <input name="question" type="text" maxlength="2000" required autocomplete="off"
               placeholder="Ask a follow-up…">
      </label>
      <button type="submit" aria-label="Ask" title="Ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
    </form>
    <noscript>Enable JavaScript to generate an AI Summary.</noscript>
  </div>
</section>
<script type="module" src="{{ url_for('ai_overview.static', filename='overview.js') }}"></script>
